name: Build OniProfiler
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    name: Application, interface and portable C++ tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install application and test dependencies
        run: python -m pip install -e 'controlplane[test]' 'build==1.3.0' 'playwright==1.57.0'
      - name: Verify release metadata and workflow contracts
        run: python tools/check_release.py
      - name: Compile portable C++
        run: |
          cmake -S . -B build/offline -DONIPROFILER_OFFLINE_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/offline --parallel 2
      - name: Test C++, API, agent, SDKs and report data
        run: ctest --test-dir build/offline --output-on-failure
      - name: Real loopback HTTP service and agent smoke
        run: python tests/http_smoke.py
      - name: Browser checks
        run: |
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py --screenshots test-output/offline
          python tests/dashboard_smoke.py --screenshots test-output/dashboard
      - name: Build application wheel and source
        run: |
          python -m build --wheel --outdir dist controlplane
          python tools/package.py --output dist
          python tools/check_release.py --checksums dist
      - name: Upload source, dashboard and agent
        uses: actions/upload-artifact@v7
        with:
          name: OniProfiler-application
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OniProfiler-interface-checks
          path: |
            test-output/
            build/offline/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
  native:
    name: Native plugin (${{ matrix.platform }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            extension: so
          - os: windows-2025
            platform: windows-x86_64
            extension: dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install verified Linux LLVM 20 toolchain
        if: runner.os == 'Linux'
        run: bash tools/ci/install-llvm-linux.sh
      - name: Set up x64 Windows SDK and MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Install checksum-verified Windows LLVM 20.1.8
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/install-llvm-windows.ps1
      - name: Install build and application dependencies
        run: python -m pip install 'conan==2.29.1' 'cmake==3.31.6' 'ninja==1.11.1.3' -e 'controlplane[test]'
      - uses: actions/cache@v5
        with:
          path: .conan2/p
          key: oni-native-v2-${{ matrix.os }}-${{ matrix.platform }}-clang20-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}
      - name: Resolve and lock native dependencies
        run: |
          conan lock create . --lockfile-out=conan.lock
          conan install . --lockfile=conan.lock --build=missing
          conan graph info . --lockfile=conan.lock --format=json --out-file=conan-graph.json
      - name: Configure pinned Spark and Endstone integration
        run: cmake --preset conan-relwithdebinfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build native plugin and tests
        run: cmake --build --preset conan-relwithdebinfo --parallel 2
      - name: Run native engine and OniProfiler tests
        run: ctest --test-dir build/RelWithDebInfo --output-on-failure
      - name: Package plugin, notices and corresponding source
        run: |
          python tools/package.py --build-dir build/RelWithDebInfo --platform ${{ matrix.platform }} --output dist
          python tools/check_release.py --checksums dist
      - name: Upload installable plugin file
        uses: actions/upload-artifact@v7
        with:
          path: dist/endstone_oniprofiler.${{ matrix.extension }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload platform release package and source
        uses: actions/upload-artifact@v7
        with:
          name: OniProfiler-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OniProfiler-diagnostics-${{ matrix.platform }}
          path: |
            build/RelWithDebInfo/Testing/Temporary/LastTest.log
            build/RelWithDebInfo/CMakeFiles/CMakeConfigureLog.yaml
            conan.lock
            conan-graph.json
          if-no-files-found: warn
          retention-days: 14
  draft-release:
    name: Assemble a draft release after all build gates pass
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [checks, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: OniProfiler-application
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: OniProfiler-linux-x86_64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: OniProfiler-windows-x86_64
          path: release-assets
      - name: Verify packages and create a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/check_release.py --tag "$RELEASE_TAG" --release-assets release-assets --checksums release-assets
          release_flags=(--draft)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag "${release_flags[@]}" --title "OniProfiler powered by spark $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
